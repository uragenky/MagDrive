name: 'Release MagDrive (Windows)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    permissions:
      contents: write
    # Note: To re-enable Linux and macOS later, switch back to a matrix strategy:
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     include:
    #       - platform: 'windows-latest'
    #       - platform: 'ubuntu-22.04'
    #       - platform: 'macos-latest'
    # runs-on: ${{ matrix.platform }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # System dependencies for Linux (kept for future reference when re-enabling Linux)
      # - name: Install system dependencies (Linux only)
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Windows installer (.msi & .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MagDrive v__VERSION__'
          releaseBody: 'Automated release for MagDrive Windows. Download the Windows installer (.msi or .exe) from the assets below.'
          releaseDraft: false
          prerelease: false
