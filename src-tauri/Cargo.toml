[package]
name = "magdrive"
version = "0.1.0"
description = "MagDrive - Distributed Encrypted Vault"
authors = ["MagDrive Team"]
edition = "2021"

[lib]
name = "magdrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
reed-solomon-erasure = "6.0"
sha2 = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tiny_http = "0.12"
url = "2.5"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
flate2 = "1.0"
thiserror = "1.0"
dirs = "5.0"
rfd = { version = "0.15", default-features = false, features = ["tokio", "gtk3", "common-controls-v6"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
